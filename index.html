<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wedding DJ Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky brand bar + left section rail (chip strip on phones) + one working column of cards; dashboard is a single dense event table. */
:root{
  --brand:#6b2d5c;
  --accent:var(--brand);
  --on-brand:#ffffff;
  --bg:#f5f3f6; --surface:#ffffff; --surface-2:#faf8fb; --line:#e5dfe7; --line-2:#d3cad6;
  --fg:#1c161f; --muted:#6a6070; --tint:color-mix(in oklab,var(--brand) 9%,var(--surface));
  --ok:#2c7a4b; --ok-bg:#e5f3ea; --warn:#9a5806; --warn-bg:#fbefdc; --danger:#b3261e; --danger-bg:#fbe7e5;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:color-mix(in oklab,var(--brand) 48%,#fff);
  --bg:#131015; --surface:#1c171f; --surface-2:#221c25; --line:#342c38; --line-2:#463c4b;
  --fg:#efe9f1; --muted:#a69ca9; --tint:color-mix(in oklab,var(--brand) 22%,var(--surface));
  --ok:#73c995; --ok-bg:#1d3326; --warn:#e3aa55; --warn-bg:#3a2b14; --danger:#f1918a; --danger-bg:#3d1f1d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --accent:color-mix(in oklab,var(--brand) 48%,#fff);
  --bg:#131015; --surface:#1c171f; --surface-2:#221c25; --line:#342c38; --line-2:#463c4b;
  --fg:#efe9f1; --muted:#a69ca9; --tint:color-mix(in oklab,var(--brand) 22%,var(--surface));
  --ok:#73c995; --ok-bg:#1d3326; --warn:#e3aa55; --warn-bg:#3a2b14; --danger:#f1918a; --danger-bg:#3d1f1d;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding-block:12px;max-width:1240px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}
.brand img{max-height:40px;width:auto;max-width:180px;display:block}
.mark{width:36px;height:36px;border-radius:8px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:700 15px var(--f-display);flex:none}
.brand-name{font:700 16px/1.15 var(--f-display)}
.brand-tag{font-size:12px;color:var(--muted)}
.top-mid{flex:1;min-width:0;display:flex;flex-direction:column}
.couple{font:700 19px/1.2 var(--f-display);overflow-wrap:anywhere}
.top-meta{font-size:13px;color:var(--muted)}
.count{display:flex;align-items:baseline;gap:8px;text-align:right}
.count b{font:700 34px/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.count span{font-size:13px;color:var(--muted);max-width:7em;line-height:1.2}
.save{font-size:12px;color:var(--muted);min-width:9ch;text-align:right}
.save.err{color:var(--danger)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:14px;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn.danger{color:var(--danger);border-color:color-mix(in oklab,var(--danger) 40%,var(--line))}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;width:30px;height:30px;border-radius:6px;cursor:pointer;color:var(--muted);display:grid;place-items:center;font-size:15px}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}

/* Banners */
.banner{max-width:1240px;margin:12px auto 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);font-size:14px}
.banner.lock{background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--tint);color:var(--fg)}
.banner .btn{margin-left:auto}

/* Planner layout */
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;padding-block:22px 80px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);align-self:start;display:flex;flex-direction:column;gap:2px}
.rail .prog{padding:4px 10px 14px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:3px}
.rail .prog small{display:block;margin-top:6px;color:var(--muted);font-size:12px}
.navi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:14px}
.navi:hover{background:var(--surface);color:var(--fg)}
.navi[aria-current="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-2);flex:none}
.dot.done{background:var(--ok);border-color:var(--ok)}
.navi.rs{margin-top:10px;border-top:1px solid var(--line);border-radius:0;padding-top:14px}
.main{min-width:0;max-width:880px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-head h2{font-size:28px}
.sec-head p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.card>h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card>h3 .muted{font:400 13px var(--f-body)}
fieldset{border:0;margin:0;padding:0;min-width:0}

/* Fields */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.help{font-size:12px;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=url],select,textarea{width:100%;min-width:0;border:1px solid var(--line-2);background:var(--surface-2);border-radius:7px;padding:8px 10px;font-size:14px}
input[type=time]{font-family:var(--f-mono);font-size:13px}
textarea{resize:vertical;line-height:1.5}
input:hover,select:hover,textarea:hover{border-color:color-mix(in oklab,var(--accent) 45%,var(--line-2))}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 20%,transparent);background:var(--surface)}
fieldset:disabled input,fieldset:disabled select,fieldset:disabled textarea{background:transparent;border-style:dashed}
.chk{display:flex;gap:9px;align-items:flex-start;cursor:pointer;font-size:14px;padding:4px 0}
.chk input{width:17px;height:17px;margin:2px 0 0;accent-color:var(--brand);flex:none}
.song{display:flex;gap:6px;align-items:center}
.song input{flex:1}
.spot{font-size:12px;color:var(--accent);white-space:nowrap;text-decoration:none;font-weight:600}
.spot:hover{text-decoration:underline}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface-2);width:max-content;max-width:100%}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);font-weight:600}
.seg button:not([aria-pressed="true"]):hover{color:var(--fg);background:var(--tint)}

/* Moments (yes/no rows that open) */
.moment{border-top:1px solid var(--line);padding:13px 0}
.moment:first-of-type{border-top:0;padding-top:2px}
.mhead{display:flex;justify-content:space-between;gap:14px;align-items:center}
.mhead h4{font:600 15px var(--f-body)}
.mhead p{margin:1px 0 0;font-size:13px}
.mbody{margin-top:12px;padding:14px;border-radius:8px;background:var(--tint)}
.mbody input,.mbody select,.mbody textarea{background:var(--surface)}

/* Lists */
.list{display:flex;flex-direction:column;gap:6px}
.lhead,.lrow{display:grid;grid-template-columns:var(--cols);gap:8px;align-items:center}
.lhead{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;padding:0 2px}
.lrow .num{font:500 12px var(--f-mono);color:var(--muted);text-align:center}
.lact{display:flex;gap:0}
.cl{display:none;font-size:11px;font-weight:600;color:var(--muted)}
.cell{min-width:0}
.empty{padding:18px;border:1px dashed var(--line-2);border-radius:8px;color:var(--muted);font-size:14px;text-align:center}
.ladd{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}

/* Genre grid */
.genres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 22px}
.genre{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.genre span{font-size:14px}
.genre .seg button{padding:4px 9px;font-size:12px}

.secfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.done-chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ok);background:var(--ok-bg);padding:3px 10px;border-radius:99px}

/* DJ controls */
.dj{border-color:color-mix(in oklab,var(--brand) 35%,var(--line));background:var(--tint)}
.dj input,.dj select{background:var(--surface)}
.code{font:500 13px var(--f-mono);background:var(--surface);border:1px solid var(--line-2);padding:6px 10px;border-radius:6px;user-select:all;overflow-wrap:anywhere}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Dashboard */
.dash{max-width:1240px;margin:0 auto;padding-block:26px 80px}
.dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.dash-head h1{font-size:34px}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:6px 0 0;color:var(--muted);font-size:14px}
.stats b{color:var(--fg);font:700 20px var(--f-display);margin-right:5px}
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
td .who{font-weight:600}
td .bar{width:110px;display:inline-block;vertical-align:middle;margin-right:8px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.plan{background:var(--tint);color:var(--accent)}
.pill.lock{background:var(--warn-bg);color:var(--warn)}
.pill.ready{background:var(--ok-bg);color:var(--ok)}
.pill.past{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.pill.risk{background:var(--danger-bg);color:var(--danger)}
.sample{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;margin-left:6px;letter-spacing:.04em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
.panel h2{font-size:20px;margin-bottom:14px}
.logo-prev{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo-prev img{max-height:48px;max-width:200px;background:var(--surface-2);border-radius:6px;padding:4px}
input[type=color]{width:48px;height:36px;border:1px solid var(--line-2);border-radius:7px;padding:2px;background:var(--surface-2)}

/* States */
.state{max-width:520px;margin:12vh auto;text-align:center;padding:0 16px}
.state h2{font-size:24px;margin-bottom:8px}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;margin:0 auto 14px;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}

/* Run sheet */
.rs h3{font-size:15px;margin:22px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--brand);color:var(--fg)}
.rs h3:first-child{margin-top:0}
.rs table{min-width:0;font-size:14px}
.rs td,.rs th{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.rs .t{font-family:var(--f-mono);font-size:13px;white-space:nowrap;width:1%}
.rs .k{color:var(--muted);width:32%}
.rs .none{color:var(--muted);font-style:italic}
.rs-scroll{overflow-x:auto}
.rs p{margin:4px 0;white-space:pre-wrap}

/* Phones */
@media (max-width:860px){
  .top{position:static}
  .top-in{gap:8px 14px}
  .top-mid{order:5;flex-basis:100%}
  .brand-tag{display:none}
  .brand img{max-height:32px}
  .count{margin-left:auto}
  .save{display:none}
  .shell{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:0}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;flex-direction:row;overflow-x:auto;background:var(--bg);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));gap:6px;border-bottom:1px solid var(--line);scrollbar-width:none}
  .rail .prog{display:none}
  .navi{white-space:nowrap;width:auto;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:6px 11px}
  .navi[aria-current="true"]{box-shadow:inset 0 0 0 1.5px var(--accent)}
  .navi.rs{margin:0;border:0;border-radius:7px;padding-top:6px}
  .grid,.grid.g3,.genres{grid-template-columns:minmax(0,1fr)}
  .lhead{display:none}
  .lrow{grid-template-columns:minmax(0,1fr)!important;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px}
  .lrow .num{text-align:left}
  .cl{display:block;margin-bottom:3px}
  .lact{justify-content:flex-end}
  .count b{font-size:26px}
  .card{padding:16px}
  .sec-head h2{font-size:24px}
}
</style>

/* ---------- run sheet ---------- */
function runSheet(e){
  const g = (p) => get(e, p);
  const v = x => x ? esc(x) : '<span class="none">—</span>';
  const kv = rows => `<table><tbody>${rows.filter(r => r[1]).map(r => `<tr><td class="k">${r[0]}</td><td>${esc(r[1])}</td></tr>`).join('') || '<tr><td class="none">Nothing entered</td></tr>'}</tbody></table>`;
  const names = [g('general.p1.name'), g('general.p2.name')].filter(Boolean).join(' & ') || 'Unnamed couple';
  const ven = g('venues.ceremony.name'); const rven = g('venues.reception.same') ? ven : g('venues.reception.name');
  let h = `<h3>Event</h3>` + kv([['Couple', names], ['Date', fmtD(g('general.date'), true)], ['Guests', g('general.guests')], ['Ceremony venue', [ven, g('venues.ceremony.address')].filter(Boolean).join(', ')], ['Reception venue', [rven, g('venues.reception.same') ? '' : g('venues.reception.address')].filter(Boolean).join(', ')], ['Load-in', fmtT(g('venues.setup.loadIn'))], ['Guest arrival', fmtT(g('general.guestArrival'))], ['Reception', [fmtT(g('general.receptionStart')), fmtT(g('general.receptionEnd'))].filter(Boolean).join(' – ')], ['Sound curfew', fmtT(g('venues.setup.curfew'))], ['Day-of contact', g('general.coordinator')], [g('general.p1.name') || 'Partner one', [g('general.p1.phone'), g('general.p1.pron') && 'say: ' + g('general.p1.pron')].filter(Boolean).join(' · ')], [g('general.p2.name') || 'Partner two', [g('general.p2.phone'), g('general.p2.pron') && 'say: ' + g('general.p2.pron')].filter(Boolean).join(' · ')], ['Parking & loading', g('venues.setup.parking')]]);
  const tl = g('timeline.items') || [];
  h += `<h3>Timeline</h3>` + (tl.length ? `<table><tbody>${tl.map(r => `<tr><td class="t">${esc(fmtT(r.time)) || '—'}</td><td><b>${esc(r.what)}</b>${r.notes ? ` <span class="none" style="font-style:normal">· ${esc(r.notes)}</span>` : ''}</td></tr>`).join('')}</tbody></table>` : '<p class="none">No timeline entered.</p>');
  const cues = [];
  const add = (moment, who, song, note) => cues.push([moment, who || '', song || '', note || '']);
  if (g('ceremony.on') === false) add('Ceremony', '', '', g('ceremony.paOnly') ? 'No music — PA & mic for officiant only' : 'No ceremony services');
  else {
    if (g('ceremony.mics')) add('Ceremony mics', g('ceremony.officiant'), '', [g('ceremony.mics'), g('ceremony.vows')].filter(Boolean).join('; '));
    if (g('ceremony.pre.on')) add('Pre-ceremony', '', g('ceremony.pre.style'), g('ceremony.pre.notes'));
    if (g('ceremony.proc.on')) { add('Processional — wedding party', '', g('ceremony.proc.party'), g('ceremony.proc.notes')); add('Processional — couple', '', g('ceremony.proc.couple'), ''); }
    if (g('ceremony.unity.on')) add('Unity ceremony', g('ceremony.unity.type'), g('ceremony.unity.song'), '');
    if (g('ceremony.registry.on')) add('Registry signing', '', g('ceremony.registry.song'), g('ceremony.registry.notes'));
    if (g('ceremony.rec.on')) add('Recessional', '', g('ceremony.rec.song'), g('ceremony.rec.notes'));
  }
  if (g('cocktail.on')) add('Cocktail hour', g('cocktail.where'), g('cocktail.style'), [fmtT(g('cocktail.start')), fmtT(g('cocktail.end'))].filter(Boolean).join(' – '));
  if (g('entrance.on')) { add('Grand entrance — party', g('entrance.style'), g('entrance.partySong'), ''); add('Grand entrance — couple', g('entrance.intro'), g('entrance.coupleSong'), ''); }
  add('Dinner', g('dinner.style'), g('dinner.music'), [g('dinner.djMeal') && 'DJ meal: ' + g('dinner.djMeal'), g('dinner.notes')].filter(Boolean).join('; '));
  if (g('dinner.blessing.on')) add('Blessing', g('dinner.blessing.by'), '', g('dinner.blessing.notes'));
  if (g('speeches.toast.on')) add('Toast', g('speeches.toast.by'), '', g('speeches.toast.notes'));
  const dn = { first: 'First dance', parent1: 'Parent dance', parent2: 'Parent dance', party: 'Wedding party dance', anniv: 'Anniversary dance', cake: 'Cake cutting', bouquet: 'Bouquet toss', garter: 'Garter toss', money: 'Money dance', last: 'Last dance' };
  Object.entries(dn).forEach(([k, l]) => { if (g(`dances.${k}.on`)) add(l, g(`dances.${k}.who`) || g(`dances.${k}.when`), g(`dances.${k}.song`), [g(`dances.${k}.edit`), g(`dances.${k}.notes`)].filter(Boolean).join('; ')); });
  (g('dances.extra') || []).forEach(r => add('Special dance', r.who, r.song, r.when));
  h += `<h3>Music cues</h3><div class="rs-scroll"><table><thead><tr><th>Moment</th><th>Who / details</th><th>Song</th><th>Notes</th></tr></thead><tbody>${cues.map(c => `<tr><td><b>${esc(c[0])}</b></td><td>${v(c[1])}</td><td>${v(c[2])}</td><td>${v(c[3])}</td></tr>`).join('')}</tbody></table></div>`;
  const intros = g('entrance.on') ? (g('entrance.intros') || []) : [];
  if (intros.length) h += `<h3>Introductions (in order)</h3><table><tbody>${intros.map((r, i) => `<tr><td class="t">${i + 1}</td><td><b>${esc(r.names)}</b>${r.say ? ` <i>(${esc(r.say)})</i>` : ''}</td><td>${v(r.role)}</td><td>${v(r.song)}</td></tr>`).join('')}</tbody></table>`;
  const sp = g('speeches.speakers') || [];
  h += `<h3>Speeches</h3>` + kv([['MC', [g('speeches.mc'), g('speeches.mcNames')].filter(Boolean).join(' — ')], ['When', g('speeches.when')], ['Length', g('speeches.length')]]) + (sp.length ? `<table><tbody>${sp.map((r, i) => `<tr><td class="t">${i + 1}</td><td><b>${esc(r.name)}</b></td><td>${v(r.rel)}</td><td>${v(r.mic)}</td><td>${v(r.song)}</td></tr>`).join('')}</tbody></table>` : '');
  const trad = TRADITIONS.filter(t => g('traditions.items.' + slug(t)));
  const addons = [['uplight','Uplighting','color'],['monogram','Monogram','text'],['booth','Photo booth','hours'],['sparks','Cold sparks','when'],['clouds','Dancing on the clouds','notes']].filter(a => g(`traditions.${a[0]}.on`)).map(a => [a[1], g(`traditions.${a[0]}.${a[2]}`) || 'Yes']);
  if (trad.length || addons.length || g('traditions.notes')) h += `<h3>Traditions & add-ons</h3>` + kv([['Traditions', trad.join(', ')], ['Details', g('traditions.notes')], ...addons]);
  const gen = GENRES.map(x => [x, g('music.genres.' + slug(x))]).filter(x => x[1]);
  h += `<h3>Music direction</h3>` + kv([['Play lots', gen.filter(x => x[1] === 'Lots').map(x => x[0]).join(', ')], ['Some', gen.filter(x => x[1] === 'Some').map(x => x[0]).join(', ')], ['A little', gen.filter(x => x[1] === 'Little').map(x => x[0]).join(', ')], ['Avoid', gen.filter(x => x[1] === 'None').map(x => x[0]).join(', ')], ['Guest requests', g('music.requests')], ['Lyrics', g('music.clean')], ['Playlist', g('music.playlist')], ['Vibe', g('music.vibe')]]);
  const songs = (k, t) => { const a = g(k) || []; return a.length ? `<p><b>${t}</b></p><table><tbody>${a.map(r => `<tr><td>${esc([r.song, r.artist].filter(Boolean).join(' – '))}</td><td class="none" style="font-style:normal">${esc(r.note || '')}</td></tr>`).join('')}</tbody></table>` : ''; };
  h += songs('music.must', 'Must play') + songs('music.maybe', 'Play if possible') + songs('music.dnp', 'Do not play');
  const vd = g('vendors.list') || [];
  if (vd.length) h += `<h3>Vendors</h3><table><tbody>${vd.map(r => `<tr><td class="k">${v(r.role)}</td><td>${v(r.name)}</td><td>${v(r.phone)}</td><td>${v(r.email)}</td></tr>`).join('')}</tbody></table>`;
  if (g('notes.text')) h += `<h3>Notes from the couple</h3><p>${esc(g('notes.text'))}</p>`;
  return h;
}
R.runsheet = () => card('Day-of run sheet', `<div class="row" style="margin-bottom:14px">${downloads ? '<button type="button" class="btn primary sm" data-action="download">Download printable copy</button>' : ''}<span class="muted" style="font-size:13px">Built automatically from the planner. Only answers that have been filled in appear here.</span></div><div class="rs">${runSheet(ev)}</div>`);

/* ---------- top bar ---------- */
function renderTop(){
  const t = $('#topIn');
  if (!ev || !evId){
    t.innerHTML = brandHTML() + `<div class="top-mid"></div>${isDJ ? `<button type="button" class="btn" data-action="brand">Branding</button><button type="button" class="btn primary" data-action="new">New event</button>` : ''}`;
  } else {
    const n = [get(ev,'general.p1.name'), get(ev,'general.p2.name')].filter(Boolean).join(' & ') || 'New couple';
    const d = daysUntil(get(ev,'general.date'));
    const venue = get(ev,'venues.ceremony.name') || get(ev,'venues.reception.name');
    t.innerHTML = brandHTML() + `<div class="top-mid"><span class="couple">${esc(n)}</span><span class="top-meta">${[fmtD(get(ev,'general.date'), true), venue].filter(Boolean).map(esc).join(' · ') || 'Add your date in Couple & event'}</span></div>` +
      (d == null ? '' : `<div class="count"><b>${d < 0 ? Math.abs(d) : d}</b><span>${d < 0 ? 'days since the wedding' : d === 0 ? 'Today’s the day!' : d === 1 ? 'day to go' : 'days to go'}</span></div>`) +
      `<div class="save ${saveState === 'error' || saveState === 'denied' ? 'err' : ''}" aria-live="polite">${{saving:'Saving…', saved:'All changes saved', error:'Couldn’t save — check your connection', denied:'View-only access', '':''}[saveState]}</div>` +
      (isDJ ? `<button type="button" class="btn ghost sm" data-action="back">← All events</button>` : '');
  }
  requestAnimationFrame(() => document.documentElement.style.setProperty('--toph', $('#top').offsetHeight + 'px'));
}
function renderBanners(){
  const b = $('#banners'); let h = '';
  if (ev && evId){
    if (isDJ && previewCouple) h += `<div class="banner info"><span>You’re previewing what the couple sees.</span><button type="button" class="btn sm" data-action="preview">Exit preview</button></div>`;
    const L_ = lockInfo(ev);
    if (L_.locked) h += `<div class="banner lock"><span>🔒 ${djView() ? 'Locked for the couple. You can still edit as the DJ.' : esc(L_.why)}</span></div>`;
    else if (L_.left != null && L_.left <= 14 && L_.left >= 0) h += `<div class="banner info"><span>This planner locks in <b>${L_.left} day${L_.left === 1 ? '' : 's'}</b> (${L_.days} days before the wedding). Please finish any changes before then.</span></div>`;
  }
  b.innerHTML = h;
}

/* ---------- planner ---------- */
function renderPlanner(){
  renderTop(); renderBanners();
  const pct = progressOf(ev);
  const nav = SECTIONS.map(([id, t]) => `<button type="button" class="navi" data-action="nav" data-s="${id}" aria-current="${section === id}"><span class="dot ${get(ev, 'done.' + id) ? 'done' : ''}"></span>${t}</button>`).join('') +
    `<button type="button" class="navi rs" data-action="nav" data-s="runsheet" aria-current="${section === 'runsheet'}">📋 Day-of run sheet</button>`;
  $('#app').innerHTML = `<div class="shell"><nav class="rail" aria-label="Planner sections"><div class="prog"><div class="bar"><i style="width:${pct}%"></i></div><small>${pct}% complete</small></div>${nav}</nav><main class="main" id="main"></main></div>`;
  renderMain();
}
function renderMain(){
  const m = $('#main'); if (!m) return;
  const meta = SECTIONS.find(s => s[0] === section) || ['runsheet', 'Day-of run sheet', 'Everything your DJ needs on the day, on one page.'];
  const idx = SECTIONS.findIndex(s => s[0] === section);
  const done = get(ev, 'done.' + section);
  const next = SECTIONS[idx + 1];
  let h = `<div class="sec-head"><div><h2>${meta[1]}</h2><p>${meta[2]}</p></div>${done ? '<span class="done-chip">✓ Marked complete</span>' : ''}</div>`;
  if (section === 'overview' && djView()) h += djPanel();
  h += `<fieldset ${canEdit() || section === 'runsheet' ? '' : 'disabled'}>${R[section]()}</fieldset>`;
  if (section !== 'runsheet') h += `<div class="secfoot"><button type="button" class="btn ${done ? '' : 'primary'}" data-action="done" ${canEdit() ? '' : 'disabled'}>${done ? 'Mark as not finished' : 'Mark section complete'}</button>${next ? `<button type="button" class="btn ghost" data-action="nav" data-s="${next[0]}">Next: ${next[1]} →</button>` : `<button type="button" class="btn ghost" data-action="nav" data-s="runsheet">See the run sheet →</button>`}</div>`;
  m.innerHTML = h;
  needsRender = false;
}
function djPanel(){
  const mode = get(ev, 'lock.mode') || 'auto';
  const code = '#plan-' + evId;
  return `<section class="card dj"><h3>DJ controls <span class="muted">Only you see this panel</span></h3>
  <div class="grid">
    <div class="fld"><span class="lbl">Couple’s planner link</span><div class="row"><span class="code" id="plancode">${esc(code)}</span><button type="button" class="btn sm" data-action="copy">Copy</button></div><span class="help">Share this artifact with the couple, then send them its link with this ending added.</span></div>
    <div class="fld"><span class="lbl">Couple editing</span>${seg('lock.mode', ['auto','locked','open'], mode).replace(/>auto</,'>Auto-lock<').replace(/>locked</,'>Locked now<').replace(/>open</,'>Always open<')}${mode === 'auto' ? `<div class="row" style="margin-top:6px"><label class="help" for="${fid('lock.days')}">Lock this many days before:</label><input type="number" id="${fid('lock.days')}" data-k="lock.days" value="${esc(get(ev,'lock.days') ?? brand.lockDays)}" min="0" style="width:80px"></div>` : ''}</div>
  </div>
  <div class="row" style="margin-top:14px"><button type="button" class="btn sm" data-action="preview">Preview as couple</button><button type="button" class="btn sm" data-action="nav" data-s="runsheet">Open run sheet</button>${confirmDel ? `<span class="muted" style="font-size:13px">Delete this event and all its answers?</span><button type="button" class="btn sm danger" data-action="delete-yes">Yes, delete</button><button type="button" class="btn sm ghost" data-action="delete-no">Cancel</button>` : `<button type="button" class="btn sm ghost danger" data-action="delete">Delete event</button>`}</div></section>`;
}

/* ---------- dashboard ---------- */
function statusOf(e){
  const s = e.summary || {}; const d = daysUntil(s.date); const p = s.progress || 0; const L_ = lockInfo(e);
  if (d != null && d < 0) return ['past','Past'];
  if (p >= 100) return ['ready','Ready'];
  if (L_.locked) return ['lock','Locked'];
  if (d != null && d <= 45 && p < 60) return ['risk','Needs attention'];
  return ['plan','Planning'];
}
function renderDash(){
  renderTop(); renderBanners();
  if (!isDJ){ $('#app').innerHTML = `<div class="state"><h2>Open your planner link</h2><p class="muted">Your DJ will send you a link to your own wedding planner. Open that link to fill in your music and timeline.</p></div>`; return; }
  const list = events.slice().sort((a, b) => (a.summary?.date || '9999').localeCompare(b.summary?.date || '9999'));
  const up = list.filter(e => (daysUntil(e.summary?.date) ?? 1) >= 0);
  const past = list.filter(e => (daysUntil(e.summary?.date) ?? 1) < 0).reverse();
  const shown = dashFilter === 'upcoming' ? up : dashFilter === 'past' ? past : list;
  const attention = up.filter(e => statusOf(e)[0] === 'risk').length;
  const next30 = up.filter(e => daysUntil(e.summary?.date) <= 30).length;
  let h = `<div class="dash">`;
  if (showBrand) h += brandPanel();
  if (showNew) h += `<form class="panel" id="newForm"><h2>New event</h2><div class="grid g3"><div class="fld"><label class="lbl" for="n_p1">Partner one</label><input type="text" id="n_p1" required></div><div class="fld"><label class="lbl" for="n_p2">Partner two</label><input type="text" id="n_p2"></div><div class="fld"><label class="lbl" for="n_date">Wedding date</label><input type="date" id="n_date" required></div><div class="fld"><label class="lbl" for="n_venue">Venue</label><input type="text" id="n_venue"></div><div class="fld"><label class="lbl" for="n_guests">Guests</label><input type="number" id="n_guests" min="0"></div></div><div class="row" style="margin-top:14px"><button class="btn primary" type="submit">Create planner</button><button class="btn ghost" type="button" data-action="new">Cancel</button></div></form>`;
  h += `<div class="dash-head"><div><h1>Weddings</h1><div class="stats tnum"><span><b>${up.length}</b>upcoming</span><span><b>${next30}</b>in the next 30 days</span><span><b>${attention}</b>need attention</span></div></div>${seg('_filter', ['upcoming','past','all'], dashFilter).replace(/data-action="seg"/g,'data-action="filter"').replace(/>upcoming</,'>Upcoming<').replace(/>past</,'>Past<').replace(/>all</,'>All<')}</div>`;
  if (!eventsLoaded) h += `<div class="tbl-wrap"><div class="state" style="margin:40px auto"><div class="spinner"></div><p class="muted">Loading events…</p></div></div>`;
  else if (!shown.length) h += `<div class="tbl-wrap"><div class="state" style="margin:40px auto"><h2>${events.length ? 'Nothing here' : 'No weddings yet'}</h2><p class="muted">${events.length ? 'Try a different filter.' : 'Create your first event, then send the couple their planner link.'}</p>${events.length ? '' : '<button type="button" class="btn primary" data-action="new">New event</button>'}</div></div>`;
  else h += `<div class="tbl-wrap"><table><thead><tr><th>Couple</th><th>Date</th><th>Days out</th><th>Venue</th><th>Guests</th><th>Planner</th><th>Status</th></tr></thead><tbody>${shown.map(e => { const s = e.summary || {}; const d = daysUntil(s.date); const st = statusOf(e); return `<tr data-open="${esc(e._id)}" tabindex="0"><td><span class="who">${esc([s.p1, s.p2].filter(Boolean).join(' & ') || 'Unnamed')}</span>${e.sample ? '<span class="sample">SAMPLE</span>' : ''}</td><td class="tnum">${esc(fmtD(s.date))}</td><td class="tnum">${d == null ? '—' : d < 0 ? `${-d} ago` : d}</td><td>${esc(s.venue || '—')}</td><td class="tnum">${esc(s.guests || '—')}</td><td class="tnum"><span class="bar"><i style="width:${s.progress || 0}%"></i></span>${s.progress || 0}%</td><td><span class="pill ${st[0]}">${st[1]}</span></td></tr>`; }).join('')}</tbody></table></div>`;
  $('#app').innerHTML = h + `</div>`;
}
function brandPanel(){
  return `<form class="panel" id="brandForm"><h2>Branding</h2><div class="grid g3">
    <div class="fld"><label class="lbl" for="b_name">Company name</label><input type="text" id="b_name" value="${esc(brand.name)}"></div>
    <div class="fld"><label class="lbl" for="b_tag">Tagline</label><input type="text" id="b_tag" value="${esc(brand.tagline)}"></div>
    <div class="fld"><label class="lbl" for="b_color">Brand colour</label><div class="row"><input type="color" id="b_color" value="${esc(brand.color)}"><span class="code" id="b_hex">${esc(brand.color)}</span></div></div>
    <div class="fld"><label class="lbl" for="b_email">Contact email</label><input type="email" id="b_email" value="${esc(brand.email)}"></div>
    <div class="fld"><label class="lbl" for="b_phone">Contact phone</label><input type="tel" id="b_phone" value="${esc(brand.phone)}"></div>
    <div class="fld"><label class="lbl" for="b_lock">Lock planners this many days before</label><input type="number" id="b_lock" min="0" value="${esc(brand.lockDays)}"></div>
    <div class="fld full"><label class="lbl" for="b_logo">Logo</label><div class="logo-prev">${brand.logo ? `<img src="${esc(brand.logo)}" alt="Current logo" id="b_prev">` : '<span class="muted" id="b_prev_none">No logo — your initials are shown instead.</span>'}<input type="file" id="b_logo" accept="image/png,image/jpeg,image/svg+xml,image/webp">${brand.logo ? '<button type="button" class="btn sm ghost" data-action="nologo">Remove logo</button>' : ''}</div><span class="help">PNG with a transparent background works best. It’s resized to fit the header.</span></div>
  </div><div class="row" style="margin-top:14px"><button class="btn primary" type="submit">Save branding</button><button class="btn ghost" type="button" data-action="brand">Close</button><span class="muted" id="b_msg" style="font-size:13px"></span></div></form>`;
}

/* ---------- saving ---------- */
function markDirty(k){
  const top = k.split('.')[0]; if (top.startsWith('_')) return;
  dirty.add(top); setSave('saving'); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700);
}
function summaryOf(e){
  return { p1: get(e,'general.p1.name') || '', p2: get(e,'general.p2.name') || '', date: get(e,'general.date') || '', venue: get(e,'venues.ceremony.name') || get(e,'venues.reception.name') || '', guests: get(e,'general.guests') || '', progress: progressOf(e) };
}
async function flush(){
  if (saving || !dirty.size || !db || !evId) return;
  saving = true;
  const keys = [...dirty]; dirty.clear();
  const patch = { summary: summaryOf(ev), updatedAt: new Date().toISOString() }; lastWrite = patch.updatedAt;
  keys.forEach(k => patch[k] = ev[k]);
  try { await db.doc('events/' + evId).update(patch); setSave(dirty.size ? 'saving' : 'saved'); }
  catch (err) { keys.forEach(k => dirty.add(k)); setSave(err && err.code === 'not_granted' ? 'denied' : 'error'); if (!(err && err.code === 'not_granted')) setTimeout(flush, 4000); else dirty.clear(); }
  saving = false;
  if (dirty.size) { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 300); }
}
function setSave(s){ saveState = s; const el = $('.save'); if (el){ el.className = 'save' + (s === 'error' || s === 'denied' ? ' err' : ''); el.textContent = {saving:'Saving…', saved:'All changes saved', error:'Couldn’t save — check your connection', denied:'View-only access', '':''}[s]; } }

/* ---------- routing ---------- */
function route(){
  const m = location.hash.match(/^#plan-([a-z0-9]+)$/i);
  if (unsubEv && (!m || m[1] !== evId)){ unsubEv(); unsubEv = null; ev = null; evId = null; }
  if (m){ if (m[1] !== evId) openEvent(m[1]); else renderPlanner(); }
  else { ev = null; evId = null; renderDash(); }
}
function openEvent(id){
  evId = id; ev = null; section = store.get('djp-sec-' + id) || 'overview'; confirmDel = false; saveState = '';
  renderTop();
  $('#app').innerHTML = `<div class="state"><div class="spinner"></div><h2>Opening the planner</h2></div>`;
  if (!db) return;
  let timer = setTimeout(() => { if (!ev) $('#app').innerHTML = `<div class="state"><h2>This planner is taking too long to load</h2><p class="muted">Check your connection and reopen the link.</p></div>`; }, 10000);
  unsubEv = db.doc('events/' + id).onSnapshot(snap => {
    clearTimeout(timer);
    if (!snap.exists){ ev = null; $('#app').innerHTML = `<div class="state"><h2>We couldn’t find this planner</h2><p class="muted">The link may be incomplete, or the event was removed. Ask your DJ to send the link again.</p>${isDJ ? '<a class="btn" href="#events">← All events</a>' : ''}</div>`; renderTop(); return; }
    if (snap.metadata.hasPendingWrites || dirty.size || saving) return;
    const data = snap.data();
    if (ev && data.updatedAt && data.updatedAt === lastWrite) return;
    const first = !ev; ev = Object.assign(blankEvent(), data);
    if (first) { renderPlanner(); return; }
    const a = document.activeElement;
    if (a && a.closest && a.closest('#main') && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { needsRender = true; renderTop(); return; }
    renderPlanner();
  }, () => { clearTimeout(timer); $('#app').innerHTML = `<div class="state"><h2>You don’t have access to this planner</h2><p class="muted">Ask your DJ to share it with you, then open the link again.</p></div>`; });
}

/* ---------- events ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'b_color'){ $('#b_hex').textContent = t.value; return; }
  const k = t.dataset && t.dataset.k; if (!k || !ev) return;
  let v = t.type === 'checkbox' ? t.checked : t.value;
  if (k === 'lock.days') v = v === '' ? '' : Number(v);
  put(ev, k, v); markDirty(k);
  if (t.dataset.song !== undefined){ const a = t.parentElement.querySelector('.spot'); a.hidden = !v; a.href = v ? spotUrl(v) : '#'; }
  if (k.startsWith('general.') || k.startsWith('venues.')) renderTop();
  if (t.type === 'checkbox' && k === 'venues.reception.same') renderMain();
  if (t.tagName === 'SELECT' && k.startsWith('lock')) { renderBanners(); }
});
document.addEventListener('focusout', () => { setTimeout(() => { if (needsRender && !(document.activeElement && document.activeElement.closest && document.activeElement.closest('#main') && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) renderPlanner(); }, 50); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.open) location.hash = 'plan-' + e.target.dataset.open; });
document.addEventListener('click', async e => {
  const row = e.target.closest('tr[data-open]'); if (row){ location.hash = 'plan-' + row.dataset.open; return; }
  const b = e.target.closest('[data-action]'); if (!b) return;
  const a = b.dataset.action, k = b.dataset.k, i = Number(b.dataset.i);
  if (b.disabled) return;
  switch (a){
    case 'yn': put(ev, k, b.dataset.v === 'true'); markDirty(k); renderMain(); break;
    case 'seg': put(ev, k, get(ev, k) === b.dataset.v && !k.startsWith('lock') ? '' : b.dataset.v); markDirty(k); renderMain(); if (k.startsWith('lock')) renderBanners(); break;
    case 'add': { const arr = get(ev, k) || []; arr.push({}); put(ev, k, arr); markDirty(k); renderMain(); const rows = document.querySelectorAll('#main .lrow'); const last = [...rows].filter(r => r.querySelector(`[data-k^="${k}."]`)).pop(); last && last.querySelector('input,select') && last.querySelector('input,select').focus(); break; }
    case 'del': { const arr = get(ev, k); arr.splice(i, 1); markDirty(k); renderMain(); break; }
    case 'up': case 'down': { const arr = get(ev, k); const j = a === 'up' ? i - 1 : i + 1; [arr[i], arr[j]] = [arr[j], arr[i]]; markDirty(k); renderMain(); break; }
    case 'preset': { const arr = get(ev, 'timeline.items') || []; TIMELINE_PRESET.forEach(([time, what, notes]) => arr.push({ time, what, notes })); put(ev, 'timeline.items', arr); markDirty('timeline'); renderMain(); break; }
    case 'sort': { const key = t => { if (!t) return 9999; const [h, m] = t.split(':').map(Number); return (h < 6 ? h + 24 : h) * 60 + m; }; get(ev, 'timeline.items').sort((x, y) => key(x.time) - key(y.time)); markDirty('timeline'); renderMain(); break; }
    case 'done': put(ev, 'done.' + section, !get(ev, 'done.' + section)); markDirty('done'); renderPlanner(); break;
    case 'nav': section = b.dataset.s; store.set('djp-sec-' + evId, section); confirmDel = false; renderPlanner(); window.scrollTo({ top: 0 }); break;
    case 'back': location.hash = 'events'; break;
    case 'preview': previewCouple = !previewCouple; renderPlanner(); break;
    case 'copy': { const txt = $('#plancode').textContent; try { await navigator.clipboard.writeText(txt); b.textContent = 'Copied'; } catch { const r = document.createRange(); r.selectNodeContents($('#plancode')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selected — press Ctrl+C'; } setTimeout(() => b.textContent = 'Copy', 2000); break; }
    case 'delete': confirmDel = true; renderMain(); break;
    case 'delete-no': confirmDel = false; renderMain(); break;
    case 'delete-yes': { const id = evId; if (unsubEv) { unsubEv(); unsubEv = null; } ev = null; evId = null; location.hash = 'events'; try { await db.doc('events/' + id).delete(); } catch {} break; }
    case 'download': {
      const names = [get(ev,'general.p1.name'), get(ev,'general.p2.name')].filter(Boolean).join(' & ') || 'Wedding';
      const html = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(names)} — Run sheet</title><style>body{font:13px/1.45 -apple-system,Segoe UI,Arial,sans-serif;color:#1c161f;max-width:800px;margin:24px auto;padding:0 20px}h1{font-size:22px;margin:0}h3{font-size:14px;margin:20px 0 6px;padding-bottom:4px;border-bottom:2px solid ${brand.color}}table{border-collapse:collapse;width:100%}td,th{padding:5px 6px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}th{font-size:11px;text-transform:uppercase;color:#666}.k{color:#666;width:30%}.t{white-space:nowrap;width:1%;font-family:Menlo,monospace}.none{color:#888;font-style:italic}p{white-space:pre-wrap;margin:4px 0}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding-bottom:12px;margin-bottom:8px}header img{max-height:44px}@media print{body{margin:0}}</style></head><body><header><div><h1>${esc(names)}</h1><div>${esc(fmtD(get(ev,'general.date'), true))}</div></div>${brand.logo ? `<img src="${brand.logo}" alt="">` : `<b>${esc(brand.name)}</b>`}</header>${runSheet(ev)}</body></html>`;
      try { await downloads.save({ filename: slug(names) + '-run-sheet.html', data: html }); } catch (err) { if (err && err.code !== 'declined') { b.textContent = 'Download unavailable'; } }
      break; }
    case 'filter': dashFilter = b.dataset.v; store.set('djp-filter', dashFilter); renderDash(); break;
    case 'new': showNew = !showNew; showBrand = false; renderDash(); if (showNew) $('#n_p1').focus(); break;
    case 'brand': showBrand = !showBrand; showNew = false; renderDash(); break;
    case 'nologo': brand.logo = ''; renderDash(); break;
  }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'newForm'){
    const id = uid(); const n = blankEvent();
    n.general.p1.name = $('#n_p1').value.trim(); n.general.p2.name = $('#n_p2').value.trim(); n.general.date = $('#n_date').value; n.general.guests = $('#n_guests').value; n.venues.ceremony.name = $('#n_venue').value.trim();
    n.summary = summaryOf(n); n.createdAt = n.updatedAt = new Date().toISOString();
    const btn = e.target.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Creating…';
    try { await db.doc('events/' + id).set(n); showNew = false; location.hash = 'plan-' + id; }
    catch { btn.disabled = false; btn.textContent = 'Create planner'; btn.insertAdjacentHTML('afterend', '<span class="muted" style="color:var(--danger)">Couldn’t create the event. Check your connection and try again.</span>'); }
  }
  if (e.target.id === 'brandForm'){
    const f = $('#b_logo').files[0];
    if (f) brand.logo = await shrinkLogo(f);
    Object.assign(brand, { name: $('#b_name').value.trim() || 'Your DJ Company', tagline: $('#b_tag').value.trim(), color: $('#b_color').value, email: $('#b_email').value.trim(), phone: $('#b_phone').value.trim(), lockDays: Number($('#b_lock').value) || 0 });
    try { await db.doc('settings/brand').set(brand); applyBrand(); showBrand = false; renderDash(); }
    catch { $('#b_msg').textContent = 'Couldn’t save branding. Only editors of this artifact can change it.'; }
  }
});
function shrinkLogo(file){
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => { const s = Math.min(1, 480 / img.width, 160 / img.height); const c = document.createElement('canvas'); c.width = Math.round(img.width * s) || 1; c.height = Math.round(img.height * s) || 1; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/png')); }; img.onerror = () => res(brand.logo); img.src = fr.result; };
    fr.onerror = () => res(brand.logo); fr.readAsDataURL(file);
  });
}

/* ---------- boot ---------- */
applyBrand(); renderTop();
(async () => {
  const cl = window.claude;
  if (!cl || !cl.use){ $('#app').innerHTML = `<div class="state"><h2>Open this planner on claude.ai</h2><p class="muted">Saving answers needs the claude.ai viewer. Open the shared link while signed in.</p></div>`; return; }
  const [d, u, dl] = await Promise.all([cl.use('db'), cl.use('user'), cl.use('downloads')]);
  db = d; downloads = dl;
  try { isDJ = u ? await u.canEdit() : false; } catch { isDJ = false; }
  if (!db){ $('#app').innerHTML = `<div class="state"><h2>Sign in to open your planner</h2><p class="muted">Your answers are saved to your claude.ai account. Sign in, then open the link again.</p></div>`; renderTop(); return; }
  db.doc('settings/brand').onSnapshot(s => { if (s.exists){ brand = Object.assign(brand, s.data()); applyBrand(); if (ev && evId) renderTop(); else if (!showBrand && !showNew) renderDash(); } }, () => {});
  if (isDJ){
    let t = setTimeout(() => { if (!eventsLoaded){ eventsLoaded = true; if (!evId) renderDash(); } }, 10000);
    unsubEvents = db.collection('events').onSnapshot(s => { clearTimeout(t); events = s.docs.map(x => Object.assign({ _id: x.id }, x.data())); eventsLoaded = true; if (!evId && !showNew && !showBrand) renderDash(); }, () => { clearTimeout(t); eventsLoaded = true; if (!evId) renderDash(); });
  }
  window.addEventListener('hashchange', route);
  route();
})();
})();
</script>
